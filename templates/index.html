<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroke Risk Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Stroke Risk Predictor</h1>
        <p>Enter patient details below to estimate the likelihood of stroke.</p>

        <form id="strokeForm">
            <!-- Group 1: Demographics -->
            <div class="form-group">
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="" disabled selected>Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" min="1" max="120" placeholder="e.g., 55" required>
            </div>

            <div class="form-group">
                <!-- Add class="radio-group-label" -->
                <label class="radio-group-label">Ever Married:</label>
                 <div class="radio-group">
                     <div class="radio-option">
                        <input type="radio" id="mar_yes" name="ever_married" value="Yes" required>
                        <label for="mar_yes">Yes</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="mar_no" name="ever_married" value="No">
                        <label for="mar_no">No</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                 <!-- Add class="radio-group-label" -->
                <label class="radio-group-label">Residence Type:</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="res_urban" name="Residence_type" value="Urban" required>
                        <label for="res_urban">Urban</label>
                    </div>
                     <div class="radio-option">
                        <input type="radio" id="res_rural" name="Residence_type" value="Rural">
                        <label for="res_rural">Rural</label>
                    </div>
                </div>
            </div>

            <!-- Group 2: Medical History -->
             <div class="form-group">
                 <!-- Add class="radio-group-label" -->
                <label class="radio-group-label">Hypertension:</label>
                 <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="hyp_yes" name="hypertension" value="1" required>
                        <label for="hyp_yes">Yes</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="hyp_no" name="hypertension" value="0">
                        <label for="hyp_no">No</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                 <!-- Add class="radio-group-label" -->
                <label class="radio-group-label">Heart Disease:</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="hd_yes" name="heart_disease" value="1" required>
                        <label for="hd_yes">Yes</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="hd_no" name="heart_disease" value="0">
                        <label for="hd_no">No</label>
                    </div>
                </div>
            </div>

            <!-- Group 3: Lifestyle & Vitals -->
            <div class="form-group">
                <label for="avg_glucose_level">Average Glucose Level:</label>
                <input type="number" id="avg_glucose_level" name="avg_glucose_level" step="0.01" min="0" placeholder="e.g., 95.5" required>
            </div>

            <div class="form-group">
                <label for="bmi">Body Mass Index (BMI):</label>
                <input type="number" id="bmi" name="bmi" step="0.1" min="10" placeholder="e.g., 28.7">
                <small>(Leave blank if unknown - model will estimate)</small>
            </div>

             <div class="form-group">
                <label for="work_type">Work Type:</label>
                <select id="work_type" name="work_type" required>
                     <option value="" disabled selected>Select Work Type</option>
                    <option value="Private">Private</option>
                    <option value="Self-employed">Self-employed</option>
                    <option value="Govt_job">Government Job</option>
                    <option value="children">Child</option>
                    <option value="Never_worked">Never Worked</option>
                </select>
            </div>

            <div class="form-group">
                <label for="smoking_status">Smoking Status:</label>
                <select id="smoking_status" name="smoking_status" required>
                    <option value="" disabled selected>Select Smoking Status</option>
                    <option value="formerly smoked">Formerly Smoked</option>
                    <option value="never smoked">Never Smoked</option>
                    <option value="smokes">Currently Smokes</option>
                    <option value="Unknown">Unknown</option>
                </select>
            </div>

            <button type="submit">Predict Stroke Risk</button>
        </form>

        <!-- Result/Error Area -->
        <div id="result" class="result-box" style="display: none;">
            <h2>Prediction Result</h2>
            <p id="predictionText"></p>
            <p id="probabilityText"></p>
        </div>
        <div id="error" class="error-box" style="display: none;">
             <h2>Prediction Error</h2>
            <p id="errorText"></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
